<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="scoreboard.css">
</head>

<body>
  <h1>Crokinole Match Scoreboard</h1>
  <h3>Keyboard shortcuts in parentheses</h3>

  <p>
  <button class="button" onclick="setup()">Match Setup</button>
  <button class="button" onclick="disccolor()">Set colours</button>
  <button class="button" onclick="fontsize()">Set font size</button>
  <br/>
  <button class="button" onclick="clearscores()">Clear scores</button>
  </p>

  <table>
    <tr>
      <td width="40%">
        <br/>
        <button class="button" onclick="shotupdate(1)">No 20 (1)</button>
        <button class="button" onclick="shotupdate(2)">20 (2)</button>
        <button class="button" onclick="shotupdate(9)">Oppo 20 (9)</button>
        <button class="button yellow_bg" onclick="undoShot()">Undo Shot</button>        
        <br/>
        <button class="button" onclick="ptsupdate(4)">Player 1 wins (4)</button>
        <button class="button" onclick="ptsupdate(5)">Tie (5)</button>
        <button class="button" onclick="ptsupdate(6)">Player 2 wins (6)</button>
        <button class="button yellow_bg" onclick="undoScore()">Undo Score</button>
        <br/>
        <button class="button" onclick="swaphammer()">Swap Hammer (0)</button>
      </td>
      <td width="60%">
        </br>Match winning criteria: <a id="bestofXgames">Best of 3 Games</a> <a id="Xptstowin">(First to 5 Points)</a>
        <h2>Next Shot: <a id="curshooter_disp"></a></h2>
          
        <table class="scoreboard">
          <colgroup><col id="col1">
                    <col id="col2">
                    <col id="col3">
                    <col id="col4">
                    <col id="col5"></colgroup>
          <tr id="row1"><th colspan="2"><a id="matchDetail">semi?</a></th>
              <th>20s</th><th>Points</th><th>Games</th></tr>

          <tr id="row2">
            <!-- Either player1 or team1 will be hidden at all times -->
            <td id="player1" class="singles_player">Beierling</td>
            <td id="team1" class="hidden">
              <table width="100%" class="player_table">
                <tr>
                  <td id="player1a" class="doubles_player">Ray Beierling</td>
                </tr>
                <tr>
                  <td id="player1b" class="doubles_player">Jason Beierling</td>
                </tr>
              </table>
            </td>
            <td style="border-style: solid solid solid hidden!important;">
              <!-- Player/team 1 discs-->
              <div id="p1disc1" class="disc1remain"></div>
              <div id="p1disc2" class="disc1remain"></div>
              <div id="p1disc3" class="disc1remain"></div>
              <div id="p1disc4" class="disc1remain"></div>
              <div id="p1disc5" class="disc1remain"></div>
              <div id="p1disc6" class="disc1remain"></div>
              <br id="p1_disk_separater">
              <div id="p1disc7" class="disc1remain yellow_bg"></div>
              <div id="p1disc8" class="disc1remain"></div>
              <div id="p1disc9" class="disc1remain"></div>
              <div id="p1disc10" class="disc1remain"></div>
              <div id="p1disc11" class="disc1remain"></div>
              <div id="p1disc12" class="disc1remain"></div>

            </td>
            <td id="redcell"><a id="p1_20s_disp">0</a></td>
            <td id="redcell"><a id="p1_pts_disp">0</a></td>
            <td id="redcell"><a id="p1_gms_disp">0</a></td>
          </tr>

          <tr id="row3">
            <!-- Either player2 or team2 will be hidden at all times -->
            <td id="player2" class="singles_player">Slater</td>
            <td id="team2" class="hidden">
              <table width="100%" class="player_table">
                <tr>
                  <td id="player2a" class="doubles_player">Justin Slater</td>
                </tr>
                <tr>
                  <td id="player2b" class="doubles_player"">Fred Slater</td>
                </tr>
              </table>
            </td>
            <td style="border-style: solid solid solid hidden!important;">
              <!-- Player/team 2 discs-->
              <div id="p2disc1" class="disc2remain"></div>
              <div id="p2disc2" class="disc2remain"></div>
              <div id="p2disc3" class="disc2remain"></div>
              <div id="p2disc4" class="disc2remain"></div>
              <div id="p2disc5" class="disc2remain"></div>
              <div id="p2disc6" class="disc2remain"></div>
              <br id="p2_disk_separater">
              <div id="p2disc7" class="disc2remain yellow_bg"></div>
              <div id="p2disc8" class="disc2remain"></div>
              <div id="p2disc9" class="disc2remain"></div>
              <div id="p2disc10" class="disc2remain"></div>
              <div id="p2disc11" class="disc2remain"></div>
              <div id="p2disc12" class="disc2remain"></div>
            </td>
            <td id="redcell"><a id="p2_20s_disp">0</a></td>
            <td id="redcell"><a id="p2_pts_disp">0</a></td>
            <td id="redcell"><a id="p2_gms_disp">0</a></td>
          </tr>

          <tr id="row4"><th colspan="5" id="eventid">Tournament</th><th></th></tr>
        </table>
        <br/>
        <br/>

      </td>
    </tr>
  </table>
  </body>

 <script src="scoreboard.js">

</script>


</html>
